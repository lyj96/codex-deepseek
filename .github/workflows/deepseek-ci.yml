name: deepseek-ci

on:
  push:
    branches:
      - deepseek
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Check free standard runner policy
        run: |
          python3 .github/scripts/test_free_runners.py
          python3 .github/scripts/check-free-runners.py
          python3 .github/scripts/test_run_bazel_ci_environment.py
          python3 .github/scripts/test_ci_results.py
      - name: Validate shell installers
        run: |
          bash -n contrib/deepseek-subagents/install-linux.sh
          bash -n contrib/deepseek-subagents/install-macos.sh
          test_home="$RUNNER_TEMP/installer-smoke"
          mkdir -p "$test_home/.ssh" "$test_home/.config/codex-deepseek" "$test_home/.local/bin"
          printf '%s\n' 'Host devbox *.example !blocked' '  HostName devbox.example.com' > "$test_home/.ssh/config"
          printf '%s\n' 'devbox' > "$test_home/.config/codex-deepseek/ssh-hosts"
          linux_output="$(HOME="$test_home" XDG_CONFIG_HOME="$test_home/.config" bash contrib/deepseek-subagents/install-linux.sh --discover-ssh)"
          macos_output="$(HOME="$test_home" XDG_CONFIG_HOME="$test_home/.config" bash contrib/deepseek-subagents/install-macos.sh --discover-ssh)"
          grep -F 'devbox (managed)' <<<"$linux_output"
          grep -F 'devbox (managed)' <<<"$macos_output"
          if grep -Fq '*.example' <<<"$linux_output"; then
            echo 'Wildcard SSH hosts must not be discovered.' >&2
            exit 1
          fi
          mock_bin="$RUNNER_TEMP/mock-ssh-bin"
          mkdir -p "$mock_bin"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'IFS= read -r forwarded_key' \
            '[[ "$forwarded_key" == "$EXPECTED_DEEPSEEK_KEY" ]]' \
            '[[ "$*" == *"IFS= read -r DEEPSEEK_API_KEY"* ]]' \
            > "$mock_bin/ssh"
          chmod 700 "$mock_bin/ssh"
          EXPECTED_DEEPSEEK_KEY='forwarded-test-key' DEEPSEEK_API_KEY='forwarded-test-key' \
            PATH="$mock_bin:$PATH" HOME="$test_home" XDG_CONFIG_HOME="$test_home/.config" \
            bash contrib/deepseek-subagents/install-linux.sh --ssh-host devbox
          EXPECTED_DEEPSEEK_KEY='forwarded-test-key' DEEPSEEK_API_KEY='forwarded-test-key' \
            PATH="$mock_bin:$PATH" HOME="$test_home" XDG_CONFIG_HOME="$test_home/.config" \
            bash contrib/deepseek-subagents/install-macos.sh --ssh-host devbox
          original="$test_home/.local/bin/codex.before-deepseek.test"
          wrapper="$test_home/codex-dp"
          printf '%s\n' original > "$original"
          printf '%s\n' wrapper > "$wrapper"
          ln -s "$wrapper" "$test_home/.local/bin/codex"
          printf '%s\n' "$wrapper" > "$test_home/.config/codex-deepseek/ssh-wrapper-path"
          printf '%s\n' "$original" > "$test_home/.config/codex-deepseek/ssh-backup-path"
          printf '%s\n' managed > "$test_home/.config/codex-deepseek/ssh-managed"
          HOME="$test_home" bash contrib/deepseek-subagents/install-linux.sh --restore-ssh
          grep -Fx original "$test_home/.local/bin/codex"
          grep -F 'CLI command: codex-dp' contrib/deepseek-subagents/install-linux.sh
          grep -F 'CLI command: codex-dp' contrib/deepseek-subagents/install-macos.sh
          grep -F 'legacy_launcher="$bin_dir/codex-deepseek"' contrib/deepseek-subagents/install-linux.sh
          grep -F 'legacy_launcher="$bin_dir/codex-deepseek"' contrib/deepseek-subagents/install-macos.sh
      - name: Validate Windows installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path contrib/deepseek-subagents/install-windows.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            throw ($errors | Format-List | Out-String)
          }
          $installerText = Get-Content -LiteralPath contrib/deepseek-subagents/install-windows.ps1 -Raw
          if ($installerText -notmatch '"codex-dp\.cmd"' -or $installerText -notmatch 'CLI command: codex-dp') {
            throw "Windows installer does not expose the unified codex-dp command."
          }
          $originalUserProfile = $env:USERPROFILE
          $originalAppData = $env:APPDATA
          $originalLocalAppData = $env:LOCALAPPDATA
          $originalDeepSeekKey = $env:DEEPSEEK_API_KEY
          $originalPath = $env:PATH
          try {
            $smokeHome = Join-Path $env:RUNNER_TEMP "installer-smoke-windows"
            $env:USERPROFILE = $smokeHome
            $env:APPDATA = Join-Path $smokeHome "AppData"
            $env:LOCALAPPDATA = Join-Path $smokeHome "LocalAppData"
            New-Item -ItemType Directory -Path (Join-Path $smokeHome ".ssh"), (Join-Path $env:APPDATA "CodexDeepSeek") -Force | Out-Null
            [IO.File]::WriteAllLines(
              (Join-Path $smokeHome ".ssh/config"),
              @("Host devbox *.example !blocked", "  HostName devbox.example.com")
            )
            [IO.File]::WriteAllText(
              (Join-Path $env:APPDATA "CodexDeepSeek/ssh-hosts"),
              "devbox$([Environment]::NewLine)"
            )
            $output = (& ./contrib/deepseek-subagents/install-windows.ps1 -DiscoverSsh 6>&1 | Out-String)
            if ($output -notmatch 'devbox \(managed\)' -or $output -match '\*\.example') {
              throw "Windows SSH discovery smoke test failed: $output"
            }
            $mockBin = Join-Path $env:RUNNER_TEMP "mock-ssh-bin-windows"
            New-Item -ItemType Directory -Path $mockBin -Force | Out-Null
            $mockSsh = @(
              '#!/usr/bin/env bash'
              'set -euo pipefail'
              'script="$(cat)"'
              '[[ "$*" == *"bash -s"* ]]'
              '[[ "$script" == *"DEEPSEEK_API_KEY_B64=''Zm9yd2FyZGVkLXRlc3Qta2V5''"* ]]'
              '[[ "$script" == *"export DEEPSEEK_API_KEY="* ]]'
              '[[ "$script" != *"$EXPECTED_DEEPSEEK_KEY"* ]]'
            )
            [IO.File]::WriteAllLines((Join-Path $mockBin "ssh"), $mockSsh)
            & chmod 700 (Join-Path $mockBin "ssh")
            $env:EXPECTED_DEEPSEEK_KEY = "forwarded-test-key"
            $env:DEEPSEEK_API_KEY = "forwarded-test-key"
            $env:PATH = "$mockBin$([IO.Path]::PathSeparator)$originalPath"
            & ./contrib/deepseek-subagents/install-windows.ps1 -SshHost devbox
          } finally {
            $env:USERPROFILE = $originalUserProfile
            $env:APPDATA = $originalAppData
            $env:LOCALAPPDATA = $originalLocalAppData
            $env:DEEPSEEK_API_KEY = $originalDeepSeekKey
            $env:PATH = $originalPath
            Remove-Item Env:EXPECTED_DEEPSEEK_KEY -ErrorAction SilentlyContinue
          }
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
      - name: Validate codex-dp npm packages
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest contrib/deepseek-subagents/npm/test_build_npm_package.py
          node --test contrib/deepseek-subagents/npm/bin/setup.test.mjs
          npm_dist="$RUNNER_TEMP/codex-dp-npm"
          mkdir -p "$npm_dist"
          python contrib/deepseek-subagents/npm/build_npm_package.py \
            --version 0.154.0-deepseek.1 \
            --pack-output "$npm_dist/codex-dp.tgz"
          tar -xOf "$npm_dist/codex-dp.tgz" package/package.json \
            | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => { const p=JSON.parse(s); if (p.name !== "codex-dp" || p.bin["codex-dp"] !== "bin/codex-dp.js" || p.optionalDependencies) process.exit(1); })'
          stage="$RUNNER_TEMP/codex-dp-root"
          mkdir -p "$stage"
          tar -xzf "$npm_dist/codex-dp.tgz" -C "$stage" --strip-components=1
          node "$stage/bin/codex-dp.js" setup --help
          fake_codex="$RUNNER_TEMP/codex-deepseek-fake"
          printf '%s\n' '#!/bin/sh' 'printf "fake-codex %s\\n" "$*"' > "$fake_codex"
          chmod +x "$fake_codex"
          CODEX_CLI_PATH="$fake_codex" node "$stage/bin/codex-dp.js" --version \
            | grep -Fx 'fake-codex --version'
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest
          version: 0.9.103
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Check formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check
      - name: Test external provider routing
        working-directory: codex-rs
        run: |
          CARGO_BUILD_JOBS=1 just test -p codex-cli --bin codex provider_cmd::tests
          CARGO_BUILD_JOBS=1 just test -p codex-app-server suite::v2::thread_settings_update
          CARGO_BUILD_JOBS=1 just test -p codex-app-server suite::v2::account::
          CARGO_BUILD_JOBS=1 just test -p codex-app-server suite::v2::model_list
          CARGO_BUILD_JOBS=1 just test -p codex-core --lib multi_agent
          CARGO_BUILD_JOBS=1 just test -p codex-core --lib provider
          CARGO_BUILD_JOBS=1 just test -p codex-core --lib agent::control
          CARGO_BUILD_JOBS=1 just test -p codex-core --lib multi_agent_v2_external_spawn_routes_provider_from_model_prefix_without_agent_type
          CARGO_BUILD_JOBS=1 just test -p codex-core --lib multi_agent_v2_external_spawn_uses_explicit_model_route
          CARGO_BUILD_JOBS=1 just test -p codex-core --lib multi_agent_v2_external_provider_tools_use_plaintext_message_schemas
          CARGO_BUILD_JOBS=1 just test -p codex-core --lib multi_agent_v2_spawn_personal_role_uses_external_provider_and_plaintext
          CARGO_BUILD_JOBS=1 just test -p codex-core --test all provider_prefix_routes_child_to_external_responses_provider

  windows-installer:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Test real pkgconf archive extraction without MSI installation
        shell: pwsh
        run: |
          $packages = Join-Path $env:RUNNER_TEMP 'pkgconf-smoke-packages'
          New-Item -ItemType Directory -Path $packages | Out-Null
          foreach ($architecture in @('x64', 'arm64')) {
            Invoke-WebRequest "https://github.com/pkgconf/pkgconf/releases/download/pkgconf-3.0.6/pkgconf-$architecture-3.0.6.msi" -OutFile (Join-Path $packages "pkgconf-$architecture-3.0.6.msi")
          }
          ./.github/scripts/test-pkgconf-extraction.ps1 -PackageDirectory $packages
      - name: Test deferred cleanup of a locked backup
        shell: pwsh
        run: |
          . ./contrib/deepseek-subagents/install-windows.ps1 -DiscoverSsh | Out-Null
          $cleanupRoot = Join-Path $env:RUNNER_TEMP "deferred-cleanup-windows"
          $cleanupTarget = Join-Path $cleanupRoot "previous-test"
          $cleanupFile = Join-Path $cleanupTarget "old.exe"
          $cleanupReady = Join-Path $cleanupRoot "lock-ready"
          New-Item -ItemType Directory -Path $cleanupTarget -Force | Out-Null
          [IO.File]::WriteAllText($cleanupFile, "test")
          $lockScript = @(
            "`$handle = [IO.File]::Open('$cleanupFile', [IO.FileMode]::Open, [IO.FileAccess]::ReadWrite, [IO.FileShare]::None)"
            'try {'
            "  [IO.File]::WriteAllText('$cleanupReady', 'ready')"
            '  Start-Sleep -Seconds 2'
            '} finally {'
            '  $handle.Dispose()'
            '}'
          ) -join [Environment]::NewLine
          $lockCommand = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($lockScript))
          $lockProcess = Start-Process -FilePath (Get-Process -Id $PID).Path `
            -ArgumentList @('-NoLogo', '-NoProfile', '-NonInteractive', '-EncodedCommand', $lockCommand) `
            -WindowStyle Hidden `
            -PassThru
          for ($attempt = 0; $attempt -lt 20 -and -not (Test-Path -LiteralPath $cleanupReady); $attempt++) {
            Start-Sleep -Milliseconds 100
          }
          if (-not (Test-Path -LiteralPath $cleanupReady)) {
            throw "Windows cleanup lock process did not start."
          }
          if (-not (Start-DeferredInstallCleanup -InstallRoot $cleanupRoot -Paths @($cleanupTarget))) {
            throw "Windows deferred cleanup helper did not start."
          }
          Start-Sleep -Milliseconds 500
          if (-not (Test-Path -LiteralPath $cleanupTarget)) {
            throw "Windows deferred cleanup removed a locked backup directory."
          }
          $lockProcess.WaitForExit()
          for ($attempt = 0; $attempt -lt 40 -and (Test-Path -LiteralPath $cleanupTarget); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path -LiteralPath $cleanupTarget) {
            throw "Windows deferred cleanup helper did not remove the backup directory."
          }

  windows-release-compile:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - name: Check Windows release binaries
        working-directory: codex-rs
        env:
          LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
        run: >-
          cargo check --locked --target x86_64-pc-windows-msvc
          --bin codex --bin codex-app-server --bin codex-code-mode-host
          --bin codex-command-runner --bin codex-windows-sandbox-setup

  macos-release-compile:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-darwin
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-apple-darwin
      - name: Check Apple Silicon release binaries
        working-directory: codex-rs
        run: >-
          cargo check --locked --target aarch64-apple-darwin
          --bin codex --bin codex-app-server --bin codex-code-mode-host
