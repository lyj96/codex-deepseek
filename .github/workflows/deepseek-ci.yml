name: deepseek-ci

on:
  push:
    branches:
      - deepseek
  pull_request:
    branches:
      - deepseek
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest
          version: 0.9.103
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Check formatting
        working-directory: codex-rs
        run: cargo fmt --all -- --check
      - name: Test external provider routing
        working-directory: codex-rs
        run: |
          just test -p codex-core multi_agent_v2_external_spawn_routes_provider_from_model_prefix_without_agent_type
          just test -p codex-core multi_agent_v2_spawn_personal_role_uses_external_provider_and_plaintext
          just test -p codex-core personal_role_routes_child_to_external_responses_provider
