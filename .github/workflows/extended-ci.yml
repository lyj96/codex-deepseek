name: extended-ci

# Supplemental coverage, explicitly dispatched after reviewing the changed areas.
# A failed extended run remains visible; it is never converted into success.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Full matrix, three identified regressions, or only descriptor and rollout prerequisites
        type: choice
        options:
          - full
          - focused-compatibility
          - focused-descriptor-rollout
          - fence-diagnosis
        default: full

permissions:
  contents: read

jobs:
  fence-startup-diagnosis:
    if: ${{ inputs.scope == 'fence-diagnosis' && github.ref == 'refs/heads/codex/fence-startup-v0.170.0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Read trusted runner service prerequisites
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/uname -m
          /usr/bin/id -un
          /usr/bin/stat -c '%A %a %U:%G %n' /run /usr/bin/systemd-run /usr/bin/sudo
          /usr/bin/findmnt -no TARGET,FSTYPE,OPTIONS --target /run
          /usr/bin/systemctl --version

      - name: Start the unchanged released Fence action
        uses: openai/fence@7cba9082252803421a0e433f29198de6d0063221 # pin@v0.13.1
        env:
          ACTIONS_STEP_DEBUG: 'true'
        with:
          mode: audit

      - name: Read bounded systemd failure evidence
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import subprocess

          def run(args):
              result = subprocess.run(args, capture_output=True, text=True, errors='replace', timeout=15)
              return result.returncode, result.stdout, result.stderr

          code, output, error = run(['/usr/bin/systemctl', 'list-units', '--all', '--no-legend', '--plain', '--type=service', 'fence-*.service'])
          units = [line.split()[0] for line in output.splitlines() if line.split() and re.fullmatch(r'fence-[A-Za-z0-9_.@-]+\.service', line.split()[0])]
          print(json.dumps({'listUnitsExit': code, 'units': units, 'stderr': error[:512]}))
          for unit in units:
              code, output, error = run(['/usr/bin/systemctl', 'show', '--no-pager', '--property=Id,LoadState,ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,MainPID', unit])
              print(json.dumps({'unit': unit, 'showExit': code, 'properties': output[:8192], 'stderr': error[:512]}))
          code, output, error = run(['/usr/bin/sudo', '/usr/bin/journalctl', '--no-pager', '--output=json', '--since=-10min', '--lines=100', '--unit=fence-*.service'])
          messages = []
          non_json = []
          for line in output.splitlines():
              try:
                  record = json.loads(line)
              except json.JSONDecodeError:
                  non_json.append(line[:256])
                  continue
              if record.get('SYSLOG_IDENTIFIER') == 'systemd' and str(record.get('_PID')) == '1':
                  messages.append({key: str(record.get(key, ''))[:1024] for key in ('UNIT', '_SYSTEMD_UNIT', 'PRIORITY', 'MESSAGE')})
          print(json.dumps({'journalExit': code, 'trustedSystemdMessages': messages, 'nonJson': non_json, 'stderr': error[:512]}))
          PY

  bazel:
    if: ${{ inputs.scope == 'full' }}
    uses: ./.github/workflows/bazel.yml
    secrets: inherit
  rust:
    if: ${{ inputs.scope == 'full' }}
    uses: ./.github/workflows/rust-ci.yml
    with:
      run_bazel: true
    secrets: inherit
  sdk:
    if: ${{ inputs.scope == 'full' }}
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  focused-compatibility:
    if: ${{ inputs.scope == 'focused-compatibility' || inputs.scope == 'focused-descriptor-rollout' }}
    name: Focused compatibility - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    environment:
      name: bazel
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ matrix.target }}
          cache-scope: bazel-focused-compatibility
      - name: Test alternate-group rollout preservation
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          # This case needs the runner's real supplementary groups. Bazel's
          # Linux user namespace maps only one GID; retain the filesystem
          # sandbox for this TestRunner without changing build isolation.
          id -G
          cat /proc/self/gid_map
          log="$RUNNER_TEMP/rollout-alternate-group.log"
          ./.github/scripts/run-bazel-ci.sh --print-failed-action-summary --print-failed-test-logs -- \
            test --jobs=2 --local_test_jobs=1 --test_output=streamed \
            --strategy=TestRunner=processwrapper-sandbox \
            --test_arg=compression::tests::worker_preserves_alternate_group_through_materialization \
            --test_arg=--nocapture -- \
            //codex-rs/rollout:rollout-unit-tests 2>&1 | tee "$log"
          if grep -Fq 'skipping ownership regression' "$log"; then
            echo 'Alternate-group ownership assertions did not run' >&2
            exit 1
          fi
      - name: Test pinned PowerShell under Wine with a PTY
        if: always() && !cancelled() && inputs.scope == 'focused-compatibility' && steps.prepare_bazel.outcome == 'success' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          ./.github/scripts/run-bazel-ci.sh --print-failed-action-summary --print-failed-test-logs -- \
            test --jobs=2 --local_test_jobs=1 --test_output=streamed \
            --test_arg=tests::pinned_powershell_runs_under_wine_with_a_pty \
            --test_arg=--nocapture -- \
            //bazel/rules/testing/wine:wine-test-support-unit-tests
      - name: Prepare hosted macOS descriptor-test resource ceiling
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          CODEX_DESCRIPTOR_TEST_HOSTED: ${{ runner.environment }}
        run: bash .github/scripts/macos-descriptor-test-limit.sh prepare
      - name: Test high-descriptor compatibility fallback
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          ./.github/scripts/run-bazel-ci.sh --print-failed-action-summary --print-failed-test-logs -- \
            test --jobs=2 --local_test_jobs=1 --test_output=streamed \
            --test_arg=child_command::descriptor_tests::high_stdio_descriptors_use_compatible_fallback \
            --test_arg=--nocapture -- \
            //codex-rs/utils/pty:pty-unit-tests
      - name: Restore hosted macOS descriptor-test resource ceiling
        if: always() && matrix.target == 'aarch64-apple-darwin' && env.CODEX_DESCRIPTOR_TEST_ORIGINAL_MAXFILES != ''
        env:
          CODEX_DESCRIPTOR_TEST_HOSTED: ${{ runner.environment }}
        run: bash .github/scripts/macos-descriptor-test-limit.sh restore
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
